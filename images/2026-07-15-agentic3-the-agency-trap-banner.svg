<?xml version="1.0" encoding="utf-8"?>
<svg width="100%" viewBox="0 0 730 290" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>The Trap of Agency: Why round trips matter — post banner</title>
  <desc>Blog post banner showing a sequence diagram between a Golfer App and the Claude API: request 1 asks for a club recommendation, response 1 is a tool call, request 2 prepends that entire prior exchange and appends the tool result, response 2 is the final club recommendation, illustrating how the conversation history grows and is resent on every round trip, with a golf flag on the fairway</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="rect-clip">
      <rect x="0" y="0" width="730" height="290"/>
    </clipPath>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="730" height="190" fill="#E6F1FB"/>

  <!-- grass -->
  <rect x="0" y="180" width="730" height="110" fill="#C0DD97"/>
  <ellipse cx="365" cy="195" rx="420" ry="40" fill="#97C459" clip-path="url(#rect-clip)"/>

  <!-- category label -->
  <text x="39" y="29" fill="#185FA5" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">Building an Agentic Golf Caddie</text>

  <!-- title -->
  <text x="39" y="73" fill="#0C447C" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500">The Trap of Agency:</text>
  <text x="39" y="103" fill="#0C447C" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500">Why round trips matter</text>

  <!-- byline -->
  <text x="39" y="128" fill="#5F5E5A" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Every round trip resends the whole conversation</text>

  <!-- actors -->
  <rect x="380" y="40" width="100" height="28" rx="6" fill="#2C2C2A"/>
  <text x="430" y="58" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10">Golfer App</text>

  <rect x="580" y="40" width="100" height="28" rx="6" fill="#378ADD"/>
  <text x="630" y="58" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="10">Claude API</text>

  <!-- lifelines -->
  <line x1="430" y1="68" x2="430" y2="175" stroke="#B5B5AE" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="630" y1="68" x2="630" y2="175" stroke="#B5B5AE" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- request 1 -->
  <text x="530" y="80" text-anchor="middle" fill="#2C2C2A" font-family="monospace" font-size="8">you: hole 7, 150y, club?</text>
  <line x1="430" y1="85" x2="622" y2="85" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- response 1: tool call -->
  <text x="530" y="103" text-anchor="middle" fill="#185FA5" font-family="monospace" font-size="8">tool_use: get_hole_stats</text>
  <line x1="630" y1="108" x2="438" y2="108" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>

  <!-- request 2: prior exchange prepended (gray) + new tool result appended (green) -->
  <text x="530" y="128" text-anchor="middle" font-family="monospace" font-size="8">
    <tspan fill="#8B8A84">[history]</tspan>
    <tspan fill="#2F6B3A" font-weight="700"> + tool_result</tspan>
  </text>
  <line x1="430" y1="133" x2="622" y2="133" stroke="#2C2C2A" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- response 2: final recommendation -->
  <text x="530" y="151" text-anchor="middle" fill="#185FA5" font-family="monospace" font-size="8">take the 8-iron, aim left</text>
  <line x1="630" y1="156" x2="438" y2="156" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>

  <!-- golf flag -->
  <line x1="700" y1="55" x2="700" y2="185" stroke="#2C2C2A" stroke-width="2"/>
  <polygon points="700,55 726,68 700,81" fill="#E24B4A"/>
  <ellipse cx="700" cy="187" rx="10" ry="4" fill="#444441"/>
</svg>
